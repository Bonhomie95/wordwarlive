<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B0E"/>
      <stop offset="0.55" stop-color="#0D130C"/>
      <stop offset="1" stop-color="#0B0E0B"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CFFB0"/>
      <stop offset="1" stop-color="#2FCB86"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>
  <!-- W monogram -->
  <path d="M300 296 L410 612 L512 430 L614 612 L724 296" fill="none" stroke="url(#wgrad)"
        stroke-width="104" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <!-- word-tile motif -->
  <g>
    <rect x="356" y="720" width="86" height="86" rx="18" fill="none" stroke="#2A3A28" stroke-width="7"/>
    <rect x="452" y="720" width="86" height="86" rx="18" fill="#3DDC97"/>
    <rect x="548" y="720" width="86" height="86" rx="18" fill="none" stroke="#2A3A28" stroke-width="7"/>
    <rect x="644" y="720" width="86" height="86" rx="18" fill="none" stroke="#F4B940" stroke-width="7"/>
  </g>
</svg>
