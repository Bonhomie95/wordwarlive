# Sticky-session reverse proxy for WordWar, in front of 2+ server instances.
#
# WHY STICKY: Socket.io starts each connection with an HTTP long-polling
# handshake and only then upgrades to WebSocket. Every request in that
# handshake MUST reach the same backend, or you get "Session ID unknown" /
# 400 errors. Sticky sessions guarantee that. (The Redis adapter handles
# cross-node broadcast, but it does NOT make a single connection's requests
# node-independent — you still need stickiness.)
#
# WordWar additionally requires that both players of a live match are on the
# same node (the match runtime is in-memory per node). Ranked matchmaking
# enforces this itself (per-node queue); sticky sessions keep each user pinned
# to one node for their whole session, which is what the per-node queue relies
# on. See README "Scaling & sticky routing".
#
# This uses ip_hash (route by client IP). For clients behind shared NATs a
# cookie-based method distributes better — see the commented `sticky` block
# (requires nginx-plus or the 3rd-party sticky module), or terminate stickiness
# at your cloud LB instead (see deploy/README.md).

upstream wordwar_backend {
    ip_hash;                       # same client IP → same backend
    server 10.0.0.11:4000 max_fails=3 fail_timeout=15s;
    server 10.0.0.12:4000 max_fails=3 fail_timeout=15s;
    # server 10.0.0.13:4000 ...   # add nodes here

    # Cookie-based alternative (nginx-plus / sticky module):
    # sticky cookie ww_srv expires=1h httponly secure;

    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name api.wordwar.example;

    # ssl_certificate     /etc/ssl/wordwar/fullchain.pem;
    # ssl_certificate_key /etc/ssl/wordwar/privkey.pem;

    # Socket.io endpoint — long-lived upgrade, generous timeouts.
    location /socket.io/ {
        proxy_pass http://wordwar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle websockets alive
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Everything else (REST API, health, metrics).
    location / {
        proxy_pass http://wordwar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# With this proxy in front, set TRUST_PROXY=1 on each server instance so rate
# limiting keys on the real client IP (X-Forwarded-For), not the proxy.
