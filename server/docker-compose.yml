services:
  mongo:
    image: mongo:7
    container_name: wordwar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - wordwar_mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wordwar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wordwar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordwar_mongo:
  wordwar_redis:
