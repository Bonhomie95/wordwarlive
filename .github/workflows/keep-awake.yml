name: Keep API awake

# Render's free plan sleeps after 15 idle minutes and needs ~50 s to wake,
# longer than sign-in waits. ponytail: GitHub can delay scheduled runs and
# disables them after 60 days without repo activity; drop this once the API
# is on a paid Render instance.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://wordwar-server-1ujy.onrender.com/healthz
