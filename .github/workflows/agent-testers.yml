# One click: build the app for Android and iOS, then give one emulator or
# simulator to each persona, each driven by a headless Claude Code agent.
# Everything readable (build logs, screenshots, reports) is encrypted with
# results_public.pem before upload, because logs of a public repo are public.
# Decrypt on your machine with: bash scripts/collect.sh <run id>
name: Agent testers

on:
  workflow_dispatch:
    inputs:
      android_personas:
        description: Android personas from personas.json (comma-separated, all = every Android persona, none = skip Android)
        default: "malik,grace,kenji"
      ios_personas:
        description: iOS personas from personas.json (comma-separated, all = every iOS persona, none = skip iOS)
        default: "noah,sven,mateo"
      web_personas:
        description: Web personas from personas.json, a phone's browser on web_url (comma-separated, all = every web persona, none = skip the web)
        default: "none"
      web_url:
        description: "Address of the site or web app for the web personas (https://...)"
        default: ""
      app_dir:
        description: App folder (where package.json is)
        default: mobile
      app_id:
        description: Android package / iOS bundle id (if a platform uses another id, the one inside its built app is used)
        default: dev.bonhomieinc.wordwar
      framework:
        description: auto, flutter, expo, react-native, capacitor, nativescript, kmp, native or maui
        default: expo
      android_build:
        description: "Custom Android build command or prebuilt download (optional, then set apk_path)"
        default: ""
      apk_path:
        description: Path of the .apk produced by android_build
        default: ""
      ios_build:
        description: "Custom iOS build command or prebuilt download (optional, then set ios_app_path)"
        default: ""
      ios_app_path:
        description: Path of the Simulator .app produced by ios_build
        default: ""
      build_args:
        description: "Extra arguments for the automatic build, both platforms: --dart-define=API_URL=https://... for Flutter, Gradle and xcodebuild arguments for the others. Public on a public repo: put keys in the BUILD_ARGS secret"
        default: ""
      source_repo:
        description: owner/name of the app repo (empty = this repo)
        default: ""
      ref:
        description: Branch, tag or full SHA of the app repo (empty = default branch)
        default: ""
      brief:
        description: Agent brief file
        default: AGENT_BRIEF.md
      bug_report:
        description: "Bug to reproduce instead of exploring: an issue (owner/repo#123 or its URL) or the steps as text. Agents follow it: read it first"
        default: ""
      model:
        description: "Model: sonnet, opus, haiku (cheapest) or a full Claude id. With llm_base_url, the provider's model name"
        default: sonnet
      llm_base_url:
        description: "Optional: any Anthropic-compatible API instead of Claude (OpenRouter, DeepSeek, Kimi, GLM...), key in the LLM_API_KEY secret. Quality depends on how well the model reads screenshots and reasons: docs/cheaper-models.md"
        default: ""
      block_hosts:
        description: Hosts the app must not reach during tests (analytics, ads), space-separated
        default: "googleads.g.doubleclick.net pagead2.googlesyndication.com googlesyndication.com adservice.google.com app-measurement.com firebaselogging-pa.googleapis.com o0.ingest.sentry.io sentry.io"
      record_video:
        description: Record each phone's screen (encrypted with the results)
        type: boolean
        default: false
      replay_path:
        description: "Experimental, Android: after each agent, replay its path on the same phone with no model (docs/replay.md)"
        type: boolean
        default: false
      map:
        description: "Experimental, Android: map every screen. robot = no model, free; robot+agent = an agent only for the forms the robot could not pass (docs/dashboard.md). Use one persona: its phone settings are kept"
        type: choice
        options: [none, robot, robot+agent]
        default: none
      replay_traces:
        description: "Experimental, Android: no agent. Replays the traces kept in this folder (<folder>/<persona>/*.trace.json) on each persona's phone, with no model (docs/replay.md)"
        default: ""
      replay_times:
        description: "With replay_traces: replays of each trace, the last one with the network of the tools closed"
        type: number
        default: 20
      repair:
        description: "With replay_traces, uses your model credit: when a trace does not replay as recorded, at most this many proposals of the agent for the step, each checked by ecr repair (docs/replay.md). Add ', public' to print the proposals (open-source apps only)"
        default: ""

# WordWar: the test build talks to the live server (testers play as guests, see AGENT_BRIEF.md).
# No AdMob/Google ids are set, so the build uses Google's sample ad ids and hides Google sign-in.
env:
  EXPO_PUBLIC_API_URL: https://wordwar-server-1ujy.onrender.com

permissions:
  contents: read
  actions: read
  issues: read   # bug_report: read the issue to reproduce

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.m.outputs.android }}
      ios: ${{ steps.m.outputs.ios }}
      web: ${{ steps.m.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: |
          test -s results_public.pem || { echo "::error::results_public.pem is missing: run ./setup.sh first"; exit 1; }
      - id: m
        env:
          A: ${{ inputs.android_personas }}
          I: ${{ inputs.ios_personas }}
          W: ${{ inputs.web_personas }}
          U: ${{ inputs.web_url }}
        run: |
          { PERSONAS="$A" PLATFORM=android python3 scripts/matrix.py
            PERSONAS="$I" PLATFORM=ios python3 scripts/matrix.py
            PERSONAS="$W" PLATFORM=web python3 scripts/matrix.py; } >> "$GITHUB_OUTPUT"
          case "$(printf '%s' "$W" | tr -d ' ,')" in ""|none) ;; *) case "$U" in https://*|http://*) ;; *) echo "::error::web_personas needs web_url (https://...)"; exit 1 ;; esac ;; esac

  build-android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      app_commit: ${{ steps.app_source.outputs.commit || github.sha }}
      apk_sha256: ${{ steps.built.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: app_source
        if: inputs.source_repo != ''
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}   # the secret only for a private app repo
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4   # Gradle cache between runs
        with: { cache-read-only: false }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-android-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-android-
      - name: Build APK (any framework, log kept private)
        env:
          APP_DIR: ${{ inputs.source_repo != '' && format('src/{0}', inputs.app_dir) || inputs.app_dir }}
          BUILD_COMMAND: ${{ inputs.android_build }}
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILD_ARGS_SECRET: ${{ secrets.BUILD_ARGS }}
          ARTIFACT: ${{ inputs.apk_path }}
        run: bash scripts/build/android.sh "$APP_DIR" "${{ inputs.framework }}"
      # Public: which source was built and the hash of the APK, nothing from inside it
      - name: What was built
        id: built
        env:
          SOURCE: ${{ inputs.source_repo || github.repository }}
          REF: ${{ inputs.ref }}
          COMMIT: ${{ steps.app_source.outputs.commit || github.sha }}
        run: |
          SHA=$(sha256sum app.apk | cut -d' ' -f1)
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Android app: $SOURCE ${REF:-default branch} at $COMMIT, APK SHA-256 $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Encrypt APK
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: mkdir -p out && openssl enc -aes-256-cbc -pbkdf2 -salt -in app.apk -out out/app.apk.enc -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/upload-artifact@v4
        with: { name: app-android, path: out/, retention-days: 3 }
      - name: Encrypt build log
        if: always()
        run: bash scripts/encrypt_results.sh build-log-android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log-android, path: results.enc/, retention-days: 7 }

  build-ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.source_repo != ''
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}   # the secret only for a private app repo
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4   # Kotlin Multiplatform builds call Gradle from Xcode
        with: { distribution: temurin, java-version: "17" }
      - name: Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/CocoaPods
          key: npm-pods-ios-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-pods-ios-
      - name: Build Simulator .app (any framework, arm64, unsigned, log kept private)
        env:
          APP_DIR: ${{ inputs.source_repo != '' && format('src/{0}', inputs.app_dir) || inputs.app_dir }}
          BUILD_COMMAND: ${{ inputs.ios_build }}
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILD_ARGS_SECRET: ${{ secrets.BUILD_ARGS }}
          ARTIFACT: ${{ inputs.ios_app_path }}
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}   # optional repo variable, for projects with several schemes
        run: bash scripts/build/ios.sh "$APP_DIR" "${{ inputs.framework }}"
      - name: Encrypt .app
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: mkdir -p out && openssl enc -aes-256-cbc -pbkdf2 -salt -in app-ios.tgz -out out/app-ios.tgz.enc -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/upload-artifact@v4
        with: { name: app-ios, path: out/, retention-days: 3 }
      - name: Encrypt build log
        if: always()
        run: bash scripts/encrypt_results.sh build-log-ios
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log-ios, path: results.enc/, retention-days: 7 }

  android:
    needs: [plan, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10   # model usage: see "Costs and limits" in the README
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app-android }
      - name: Decrypt APK
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in app.apk.enc -out app.apk -pass env:ARTIFACT_PASSPHRASE
      - run: pip install -q pillow && npm install -g --silent @anthropic-ai/claude-code

      # The emulator resolves DNS through the host (-dns-server 127.0.0.1):
      # dnsmasq answers 0.0.0.0 for blocked hosts, iptables drops their real IPs.
      - name: Block analytics and ad hosts
        env: { HOSTS: "${{ inputs.block_hosts }}" }
        run: |
          sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null; }
          { printf 'listen-address=127.0.0.1\nbind-interfaces\nno-resolv\nserver=8.8.8.8\nserver=1.1.1.1\n'
            for h in $HOSTS; do printf 'address=/%s/0.0.0.0\naddress=/%s/::\n' "$h" "$h"; done; } | sudo tee /etc/dnsmasq.d/block.conf >/dev/null
          sudo systemctl restart dnsmasq
          for h in $HOSTS; do for ip in $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$'); do sudo iptables -I OUTPUT -d "$ip" -j REJECT; done; done

      - name: Device profile (fallback to pixel_6)
        id: profile
        env: { WANTED: "${{ matrix.profile }}" }
        run: |
          if "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c 2>/dev/null | grep -qx "$WANTED"; then echo "profile=$WANTED" >> "$GITHUB_OUTPUT"
          else echo "profile=pixel_6" >> "$GITHUB_OUTPUT"; echo "Profile $WANTED missing, pixel_6 used" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Bug report to reproduce
        if: inputs.bug_report != ''
        env:
          BUG_REPORT: ${{ inputs.bug_report }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        run: bash scripts/bug_report.sh

      # Optional: Explore-Compile-Replay compiles the path of the agent to a Maestro flow,
      # replayed once the agent is done (scripts/ecr_replay.py), or replays the traces kept
      # in a folder several times (replay_traces, scripts/replay_set.py). Both are pinned.
      - name: Explore-Compile-Replay (replay_path, replay_traces)
        if: inputs.replay_path || inputs.replay_traces != ''
        uses: actions/checkout@v4
        with:
          repository: pierridotite/explore-compile-replay
          ref: f89aa1343119a0b95d95a9342e558b2d6db847ec
          path: .ecr
          persist-credentials: false
      - if: inputs.replay_path || inputs.replay_traces != ''
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Maestro (replay_path, replay_traces)
        if: inputs.replay_path || inputs.replay_traces != ''
        env: { MAESTRO_VERSION: 2.12.1 }
        run: |
          npm install -g --silent pnpm@10 && (cd .ecr && pnpm install --frozen-lockfile --silent)
          curl -fsSL "https://get.maestro.mobile.dev" | bash >/dev/null
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # The last replay of each trace runs in this group: its processes reach the phone
      # through the loopback, and nothing else (scripts/replay_set.py checks it first).
      - name: A group with no internet (replay_traces)
        if: inputs.replay_traces != ''
        run: |
          sudo groupadd -f noinet && sudo usermod -aG noinet "$USER"
          sudo iptables -I OUTPUT -m owner --gid-owner noinet ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT -m owner --gid-owner noinet ! -o lo -j REJECT

      - name: Emulator + agent
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (inputs.replay_traces == '' || inputs.repair != '') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ (inputs.replay_traces == '' || inputs.repair != '') && secrets.ANTHROPIC_API_KEY || '' }}
          PERSONA: ${{ matrix.persona }}
          DEVICE: ${{ matrix.device }}
          FONT_SCALE: ${{ matrix.font_scale }}
          THEME: ${{ matrix.theme }}
          INCREASE_CONTRAST: ${{ matrix.increase_contrast }}
          COLOR_FILTER: ${{ matrix.color_filter }}
          NETWORK: ${{ matrix.network }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          APP_ID: ${{ inputs.app_id }}
          BRIEF: ${{ inputs.bug_report != '' && inputs.brief == 'AGENT_BRIEF.md' && 'briefs/reproduce.md' || inputs.brief }}
          MODEL: ${{ inputs.model }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          LLM_API_KEY: ${{ (inputs.replay_traces == '' || inputs.repair != '') && secrets.LLM_API_KEY || '' }}
          BLOCK_HOSTS: ${{ inputs.block_hosts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
          REPLAY_PATH: ${{ inputs.replay_path }}
          MAP: ${{ inputs.map }}
          REPLAY_TRACES: ${{ inputs.replay_traces }}
          REPLAY_TIMES: ${{ inputs.replay_times }}
          REPAIR: ${{ inputs.repair }}
          REPLAY_CLOSED_GROUP: ${{ inputs.replay_traces != '' && 'noinet' || '' }}
          REPLAY_PARAMS: ${{ inputs.replay_traces != '' && secrets.REPLAY_PARAMS || '' }}
          APP_SOURCE: ${{ inputs.source_repo || github.repository }}
          APP_REF: ${{ inputs.ref }}
          APP_COMMIT: ${{ needs.build-android.outputs.app_commit }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 127.0.0.1
          script: bash scripts/android/run_agent.sh

      # Counts, durations, hashes and step ids only: no text of the app, no typed text
      - name: Replays, public (replay_traces)
        if: always() && inputs.replay_traces != ''
        uses: actions/upload-artifact@v4
        with: { name: "replays-${{ matrix.persona }}", path: "results/${{ matrix.persona }}/replays.json", if-no-files-found: ignore, retention-days: 90 }
      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "${{ matrix.persona }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.persona }}", path: results.enc/, retention-days: 14 }

  ios:
    needs: [plan, build-ios]
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5   # free plan: 5 macOS jobs at once
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app-ios }
      - name: Decrypt .app
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in app-ios.tgz.enc -out app-ios.tgz -pass env:ARTIFACT_PASSPHRASE
          mkdir -p app && tar xzf app-ios.tgz -C app
      - name: Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Tools (AXe, Pillow, Claude Code)
        run: |
          brew install -q cameroncooke/axe/axe
          python3 -m pip install -q --break-system-packages pillow
          npm install -g --silent @anthropic-ai/claude-code

      # The simulator uses the Mac's network: /etc/hosts + pf block the hosts.
      - name: Block analytics and ad hosts
        env: { HOSTS: "${{ inputs.block_hosts }}" }
        run: |
          IPS=""
          for h in $HOSTS; do
            IPS="$IPS $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$' | tr '\n' ' ')"
            printf '0.0.0.0 %s\n:: %s\n' "$h" "$h" | sudo tee -a /etc/hosts >/dev/null
          done
          [ -n "${IPS// /}" ] && echo "block drop out quick proto { tcp udp } to { $(echo $IPS | tr ' ' ',') }" | sudo pfctl -a com.apple/agentblock -f - 2>/dev/null
          sudo pfctl -E 2>/dev/null || true
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - name: Simulator
        env:
          MODEL_NAME: ${{ matrix.simulator }}
          IOS_MAJOR: ${{ matrix.ios }}
          LOCALE: ${{ matrix.locale }}
        run: |
          # Software keyboard on screen, like a real phone
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          python3 scripts/ios/create_sim.py "$MODEL_NAME" "$IOS_MAJOR" | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/sim.env"
          UDID=$(grep '^UDID=' "$RUNNER_TEMP/sim.env" | cut -d= -f2)
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null
          d() { xcrun simctl spawn "$UDID" defaults write "$@"; }
          L="${LOCALE:-en-US}"
          d -g AppleLanguages -array "$L"; d -g AppleLocale -string "${L/-/_}"
          # Synthetic key events are US key codes: keep a US QWERTY layout,
          # otherwise on AZERTY "a" becomes "q" and Cmd+A becomes Cmd+Q (quits the app)
          d -g AppleKeyboards -array "en_US@sw=QWERTY;hw=US"
          d com.apple.Preferences KeyboardLastUsed -string "en_US@sw=QWERTY;hw=US"
          for k in KeyboardAutocapitalization KeyboardAutocorrection KeyboardPrediction KeyboardCheckSpelling; do d com.apple.Preferences $k -bool NO; done
          # No keyboard tips on first typing ("slide to type"): recent iOS reads com.apple.keyboard.preferences
          for k in DidShowContinuousPathIntroduction KeyboardDidShowProductivityTutorial DidShowGestureKeyboardIntroduction; do
            d com.apple.Preferences $k -bool YES; d com.apple.keyboard.preferences $k -bool YES
          done
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null

      - name: Bug report to reproduce
        if: inputs.bug_report != ''
        env:
          BUG_REPORT: ${{ inputs.bug_report }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        run: bash scripts/bug_report.sh

      - name: Agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONA: ${{ matrix.persona }}
          TEXT_SIZE: ${{ matrix.text_size }}
          THEME: ${{ matrix.theme }}
          INCREASE_CONTRAST: ${{ matrix.increase_contrast }}
          REDUCE_MOTION: ${{ matrix.reduce_motion }}
          COLOR_FILTER: ${{ matrix.color_filter }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          APP_ID: ${{ inputs.app_id }}
          BRIEF: ${{ inputs.bug_report != '' && inputs.brief == 'AGENT_BRIEF.md' && 'briefs/reproduce.md' || inputs.brief }}
          MODEL: ${{ inputs.model }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BLOCK_HOSTS: ${{ inputs.block_hosts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash scripts/ios/run_agent.sh

      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "${{ matrix.persona }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.persona }}", path: results.enc/, retention-days: 14 }

  web:
    needs: plan
    if: needs.plan.outputs.web != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10   # model usage: see "Costs and limits" in the README
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.web) }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Playwright with WebKit and Chromium, Claude Code)
        run: |
          python3 -m pip install -q playwright==1.58.0 pillow
          python3 -m playwright install --with-deps webkit chromium > /dev/null
          npm install -g --silent @anthropic-ai/claude-code

      # The browser also blocks these hosts itself (scripts/web/browser.py), but its routes miss the
      # target of a redirect: /etc/hosts and the firewall close that gap, like on the other runners.
      - name: Block analytics and ad hosts
        env: { HOSTS: "${{ inputs.block_hosts }}" }
        run: |
          for h in $HOSTS; do
            printf '0.0.0.0 %s\n:: %s\n' "$h" "$h" | sudo tee -a /etc/hosts >/dev/null
            for ip in $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$'); do sudo iptables -I OUTPUT -d "$ip" -j REJECT; done
          done

      - name: Bug report to reproduce
        if: inputs.bug_report != ''
        env:
          BUG_REPORT: ${{ inputs.bug_report }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        run: bash scripts/bug_report.sh

      # Hosts of block_hosts are blocked inside the browser (scripts/web/browser.py):
      # the tester is told where a link to one of them would have gone.
      - name: Browser + agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONA: ${{ matrix.persona }}
          DEVICE: ${{ matrix.device }}
          WEB_DEVICE: ${{ matrix.emulate }}
          THEME: ${{ matrix.theme }}
          INCREASE_CONTRAST: ${{ matrix.increase_contrast }}
          REDUCE_MOTION: ${{ matrix.reduce_motion }}
          COLOR_FILTER: ${{ matrix.color_filter }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          WEB_URL: ${{ inputs.web_url }}
          BRIEF: ${{ inputs.bug_report != '' && inputs.brief == 'AGENT_BRIEF.md' && 'briefs/reproduce.md' || inputs.brief }}
          MODEL: ${{ inputs.model }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BLOCK_HOSTS: ${{ inputs.block_hosts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash scripts/web/run_agent.sh

      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "${{ matrix.persona }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.persona }}", path: results.enc/, retention-days: 14 }
